name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - migrate/check/test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ltf_license_manager
          POSTGRES_USER: ltf_user
          POSTGRES_PASSWORD: ltf_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ltf_user -d ltf_license_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-secret-key
      FRONTEND_BASE_URL: http://localhost:3000
      POSTGRES_DB: ltf_license_manager
      POSTGRES_USER: ltf_user
      POSTGRES_PASSWORD: ltf_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install PDF libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi8 \
            shared-mime-info \
            fonts-dejavu-core

      - name: Install the lock compiler
        run: pip install pip-tools==7.6.2

      - name: Fail if the lock disagrees with requirements.txt
        run: |
          pip-compile --generate-hashes --no-header --output-file=/tmp/requirements.lock requirements.txt
          diff -u requirements.lock /tmp/requirements.lock

      - name: Install backend dependencies
        run: pip install --require-hashes -r requirements.lock

      - name: Check the installed packages
        run: pip check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run Django system checks
        run: python manage.py check

      - name: Run backend test suite
        run: python manage.py test

  frontend:
    name: Frontend - lint/build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --watchAll=false

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

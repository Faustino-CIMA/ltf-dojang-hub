<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · LTF</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f6f7;
        color: #181a1b;
        font-family: system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #181a1b; color: #f7f7f8; }
      }
      main { max-width: 28rem; padding: 2rem; }
      .kicker {
        margin: 0;
        color: #e30613;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 { margin: 0.75rem 0 0; font-size: 1.75rem; line-height: 1.2; }
      p { margin: 1rem 0 0; line-height: 1.5; }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        background: #e30613;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Luxembourg Taekwondo Federation</p>
      <h1>This page is not on the API.</h1>
      <p>The address you opened is not part of the LTF service.</p>
      {% if frontend_url %}
        <a href="{{ frontend_url }}">Open the LTF site</a>
      {% endif %}
    </main>
  </body>
</html>

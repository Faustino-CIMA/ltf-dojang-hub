<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ labels.stickers }} {{ item.sku }}</title>
    <style>
      @page { size: {{ sheet_width_mm }}mm {{ sheet_height_mm }}mm; margin: 0; }
      html, body { margin: 0; padding: 0; font-family: "DejaVu Sans", Arial, sans-serif; color: #111827; }
      .print-page { page-break-after: always; }
      .print-page:last-child { page-break-after: auto; }
      .sheet { position: relative; width: {{ sheet_width_mm }}mm; height: {{ sheet_height_mm }}mm; overflow: hidden; }
      .label {
        position: absolute;
        box-sizing: border-box;
        padding: 1.2mm 1.5mm;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 0.35mm;
        text-align: center;
      }
      .label img { width: 23.5mm; height: 23.5mm; }
      .sku, .name, .size, .price {
        width: 100%;
        overflow-wrap: anywhere;
        word-break: break-word;
        line-height: 1.15;
      }
      .sku { font-size: 5.5pt; font-weight: 700; letter-spacing: 0.02em; }
      .name { font-size: 6pt; font-weight: 700; }
      .size { font-size: 6.5pt; }
      .price { font-size: 8pt; font-weight: 700; }
    </style>
  </head>
  <body>
    {% for page in pages %}
      <div class="print-page">
        <div class="sheet">
          {% for label in page %}
            <div
              class="label"
              style="left: {{ label.x_mm }}mm; top: {{ label.y_mm }}mm; width: {{ label.size_mm }}mm; height: {{ label.size_mm }}mm; border-radius: {{ label.radius_mm }}mm;"
            >
              <div class="sku">{{ label.sku }}</div>
              {% if label.qr %}<img src="{{ label.qr }}" alt="QR" />{% endif %}
              <div class="name">{{ label.name }}</div>
              {% if label.variant %}<div class="size">{{ label.variant }}</div>{% endif %}
              <div class="price">{{ label.price }} EUR</div>
            </div>
          {% endfor %}
        </div>
      </div>
    {% endfor %}
  </body>
</html>
